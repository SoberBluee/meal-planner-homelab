services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: mealplanner
      MYSQL_USER: mealplanner
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    image: node:20-bookworm-slim
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      APP_PIN: "1234"
      AUTH_SECRET: change-this-to-a-long-random-string
      COOKIE_SECURE: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: mealplanner
      DB_PASSWORD: change-me
      DB_NAME: mealplanner
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run db:push && npm run dev -- -H 0.0.0.0 -p 3000"

volumes:
  mysql_data:
  app_node_modules:
