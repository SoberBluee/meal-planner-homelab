apiVersion: v1
kind: Service
metadata:
  labels:
    app: mealplanner-svc
  name: mealplanner-svc
  namespace: mealplanner
spec:
  ports:
  - name: 3000-3000
    nodePort: 30001
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: meal-planner-app
  type: NodePort

--- 

apiVersion: v1
kind: Service
metadata:
  labels:
    app: mealplanner-db-svc
  name: mealplanner-db-svc
  namespace: mealplanner
spec:
  clusterIP: None
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mealplanner-db

