apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealplanner-redis-pv
  namespace: mealplanner
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: bigkev-storage
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.65
    path: /mnt/pve/bigkev/mealplanner-redis