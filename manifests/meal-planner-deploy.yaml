apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meal-planner-app
  name: meal-planner-app
  namespace: mealplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meal-planner-app
  strategy: {}
  template:
    metadata:
      labels:
        app: meal-planner-app
    spec:
      volumes:
      - name: log-dir
        emptyDir: {}
      - name: alloy-config
        configMap:
          name: mealplanner-alloy-sidecar
      containers:
      - image: soberblue/mealplanner:1.5.0
        name: mealplanner
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: log-dir
          mountPath: /var/log/mealplanner
        resources: 
          requests:
            cpu: 500m
            memory: 500Mi
          limits:
            cpu: 500m
            memory: 500Mi
        envFrom:
        - configMapRef: 
            name: mealplanner-database-config
        - configMapRef: 
            name: mealplanner-configmap
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mealplanner-redis-secret
              key: REDIS_PASSWORD
      - image: grafana/alloy:latest
        name: alloy
        args:
          - "run"
          - "/etc/alloy/alloy-sidecar.yaml"
        volumeMounts:
        - name: alloy-config
          mountPath: /etc/alloy/
        - name: log-dir
          mountPath: /var/log/mealplanner
    
status: {}


