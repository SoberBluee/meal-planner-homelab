apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meal-planner-app
  name: meal-planner-app
  namespace: mealplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meal-planner-app
  strategy: {}
  template:
    metadata:
      labels:
        app: meal-planner-app
    spec:
      containers:
      - image: soberblue/mealplanner:1.4.1
        name: mealplanner
        ports:
        - containerPort: 3000
        resources: 
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
        envFrom:
        - configMapRef: 
            name: mealplanner-database-config
        - configMapRef: 
            name: mealplanner-configmap
status: {}


